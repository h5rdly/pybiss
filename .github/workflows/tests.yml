name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Linux, Windows, MacOS
  test-standard:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.13', '3.14', '3.14t']

    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ endsWith(matrix.python-version, 't') }}

      - name: Install PC/SC drivers, Tk and Xvfb on Linux
        if: runner.os == 'Linux'
        # bg_BG locale: lets the comma-decimal canvas test actually run here
        # (glibc); musl/mac legs skip it.
        run: |
          sudo apt-get update && sudo apt-get install -y libpcsclite1 tk xvfb
          sudo locale-gen bg_BG.UTF-8

      # Loads this platform's PC/SC library through src/sc_types and binds every
      # SCard* symbol: libpcsclite.so.1 (Linux), PCSC.framework (macOS), or
      # winscard.dll with the ...A entry points and SCARDCONTEXT=c_void_p (Windows).
      # Those three branches are real, separate ctypes code, and only the Linux one
      # is otherwise exercised against a live library - a wrong soname, a missing
      # symbol or a bad restype shows up here and nowhere else. Needs no daemon,
      # no reader, no card.
      - name: Verify PC/SC library binds
        run: python -c "from src.sc_types import pcsc; p = pcsc(); print('PC/SC bound:', p.SCardListReaders_fn, '| T0 PCI:', p.g_rgSCardT0Pci.dwProtocol)"

      - name: Run tests
        if: runner.os != 'Linux'
        timeout-minutes: 10
        run: python -X faulthandler -m unittest discover tests

      # Xvfb gives the GUI tests a display; without it they skip silently.
      # The watchdog turns a hang into a diagnosis: on timeout, SIGABRT +
      # faulthandler dump every thread's traceback into the log instead of
      # the job spinning until the 6h job limit.
      - name: Run tests (under Xvfb)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: timeout -s ABRT 480 xvfb-run -a python -X faulthandler -m unittest discover tests

  # Alpine Linux (Musl) 
  test-alpine:
    name: Test (Alpine/Musl)
    runs-on: ubuntu-latest
    container:
      image: python:3.14-alpine
    steps:
      - uses: actions/checkout@v6

      # `tk` provides libtk8.6.so, xvfb-run a display, ttf-dejavu fonts 
      - name: Install Alpine PC/SC, Tk and Xvfb dependencies
        run: apk add --no-cache pcsc-lite-libs tk xvfb-run ttf-dejavu

      # When Alpine's `tk` package jumps to Tcl/Tk 9.x and drops libtk8.6.so, this
      # line fails with the exact version story 
      - name: Verify Tk runtime matches _tkinter
        run: python -c "import _tkinter; print('Tk', _tkinter.TK_VERSION, 'Tcl', _tkinter.TCL_VERSION)"

      # Same PC/SC binding check as the other legs, but against musl's pcsc-lite.
      - name: Verify PC/SC library binds
        run: python -c "from src.sc_types import pcsc; p = pcsc(); print('PC/SC bound:', p.SCardListReaders_fn, '| T0 PCI:', p.g_rgSCardT0Pci.dwProtocol)"

      - name: Run tests
        run: xvfb-run -a python -m unittest discover tests

  # FreeBSD 
  test-freebsd:
    name: Test (FreeBSD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          # Tk's Xft text rendering needs at least one real font.
          prepare: pkg install -y python314 py314-tkinter pcsc-lite xorg-vfbserver dejavu
          # Xvfb must not inherit the SSH session's stdout/stderr and must be
          # killed afterwards, or the backgrounded child keeps the session
          # open and the step hangs forever AFTER the tests pass.
          #
          # pcscd runs here so tests/test_pcsc_daemon.py can assert that sc_ffi's
          # ctypes really handshake with a LIVE daemon on FreeBSD
          run: |
            pcscd >/dev/null 2>&1
            sleep 1
            python3.14 -c "from src.sc_types import pcsc; p = pcsc(); print('PC/SC bound:', p.SCardListReaders_fn, '| T0 PCI:', p.g_rgSCardT0Pci.dwProtocol)" || exit 1
            Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
            XVFB_PID=$!
            sleep 2
            PYBISS_REQUIRE_PCSCD=1 DISPLAY=:99 python3.14 -m unittest discover tests
            rc=$?
            kill $XVFB_PID 2>/dev/null
            pkill pcscd 2>/dev/null
            exit $rc
