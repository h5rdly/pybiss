name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Linux, Windows, MacOS
  test-standard:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.13', '3.14', '3.14t']

    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ endsWith(matrix.python-version, 't') }}

      - name: Install PC/SC drivers, Tk and Xvfb on Linux
        if: runner.os == 'Linux'
        # bg_BG locale: lets the comma-decimal canvas test actually run here
        # (glibc); musl/mac legs skip it.
        run: |
          sudo apt-get update && sudo apt-get install -y libpcsclite1 tk xvfb
          sudo locale-gen bg_BG.UTF-8

      - name: Run tests
        if: runner.os != 'Linux'
        run: python -m unittest discover tests

      # Xvfb gives the GUI tests a display; without it they skip silently
      - name: Run tests (under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover tests

  # Alpine Linux (Musl) 
  test-alpine:
    name: Test (Alpine/Musl)
    runs-on: ubuntu-latest
    container:
      image: python:3.14-alpine
    steps:
      - uses: actions/checkout@v6

      # `tk` provides libtk8.6.so, xvfb-run a display, ttf-dejavu fonts 
      - name: Install Alpine PC/SC, Tk and Xvfb dependencies
        run: apk add --no-cache pcsc-lite-libs tk xvfb-run ttf-dejavu

      - name: Run tests
        run: xvfb-run -a python -m unittest discover tests

  # FreeBSD 
  test-freebsd:
    name: Test (FreeBSD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Test in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.4"
          usesh: true
          # dejavu because Tk's Xft text rendering needs at least one real font.
          prepare: pkg install -y python314 py314-tkinter pcsc-lite xorg-vfbserver dejavu
          run: |
            Xvfb :99 -screen 0 1280x800x24 &
            sleep 2
            DISPLAY=:99 python3.14 -m unittest discover tests
